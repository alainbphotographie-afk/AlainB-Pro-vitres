<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AlainB Pro — V18.1</title>
  <style>
    :root {
      --nav: #102038;
      --teal: #2cbfad;
      --bg: #f3f6fa;
      --ink: #1d2e44;
      --mut: #6b7e91;
      --line: #dfe7ef;
      --gold: #d99a19;
      --red: #d95c5c
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px Arial, sans-serif
    }

    .side {
      position: fixed;
      inset: 0 auto 0 0;
      width: 245px;
      background: var(--nav);
      color: #e7f0fa
    }

    .brand {
      height: 77px;
      padding: 18px;
      display: flex;
      gap: 11px;
      align-items: center;
      border-bottom: 1px solid #29425f
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--teal);
      display: grid;
      place-items: center;
      color: #09263a;
      font-size: 19px;
      font-weight: bold
    }

    .brand b {
      font-size: 19px
    }

    .brand small {
      display: block;
      font-size: 10px;
      letter-spacing: 1px;
      color: #9eb5ca;
      margin-top: 3px
    }

    .nav {
      padding: 15px 10px
    }

    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #d6e3ef;
      padding: 12px 14px;
      text-align: left;
      border-radius: 8px;
      margin: 2px 0;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer
    }

    .nav button:hover,
    .nav button.active {
      background: var(--teal);
      color: #09283a
    }

    .cap {
      border-top: 1px solid #29425f;
      margin: 16px 4px 8px;
      padding: 16px 10px 0;
      color: #8399b0;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px
    }

    .foot {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: 1px solid #29425f;
      padding: 15px;
      color: #b4c5d5;
      font-size: 12px
    }

    .foot span {
      display: block;
      color: #40d4b4;
      font-size: 11px;
      margin-top: 6px
    }

    .main {
      margin-left: 245px;
      min-height: 100vh
    }

    .top {
      height: 60px;
      display: flex;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 0 28px;
      font-weight: bold
    }

    .soft {
      color: #62788f
    }

    .right {
      margin-left: auto;
      display: flex;
      gap: 8px
    }

    .pill {
      padding: 7px 10px;
      border: 1px solid #d3dfeb;
      background: #f9fbfd;
      border-radius: 8px;
      color: #526a83;
      font-size: 12px
    }

    .page {
      padding: 28px;
      max-width: 1600px;
      margin: auto
    }

    .hero {
      background: linear-gradient(110deg, #102038, #0b1c31);
      border-radius: 14px;
      padding: 25px 28px;
      color: #fff;
      margin-bottom: 23px
    }

    .eyebrow {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--teal)
    }

    .hero h1 {
      margin: 6px 0;
      font-size: 25px
    }

    .hero p {
      margin: 0;
      color: #d7e4ef;
      line-height: 1.5
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(155px, 1fr));
      gap: 16px;
      margin-bottom: 24px
    }

    .card,
    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 18px;
      box-shadow: 0 6px 22px #1635530c
    }

    .label {
      font-weight: bold;
      color: #687b90
    }

    .value {
      font-size: 27px;
      font-weight: bold;
      margin: 7px 0 3px;
      color: #17324c
    }

    .teal {
      color: #129984
    }

    .small {
      font-size: 12px;
      color: var(--mut)
    }

    .panel h2 {
      font-size: 16px;
      margin: 0
    }

    .panelhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 11px;
      margin-bottom: 10px
    }

    .link {
      border: 0;
      background: none;
      color: #129984;
      font-weight: bold;
      cursor: pointer
    }

    .twocol {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 20px
    }

    .item {
      border: 1px solid #e2eaf1;
      border-radius: 9px;
      padding: 11px 13px;
      margin: 8px 0;
      background: #fff
    }

    .item.late {
      border-left: 4px solid var(--red);
      background: #fff8f8
    }

    .item.soon {
      border-left: 4px solid var(--gold);
      background: #fffdf4
    }

    .item.ok {
      border-left: 4px solid var(--teal);
      background: #f8fffd
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 17px
    }

    .toolbar h1 {
      font-size: 24px;
      margin: 0 auto 0 0
    }

    .btn {
      border: 0;
      border-radius: 8px;
      background: var(--teal);
      color: #09283a;
      font-weight: bold;
      padding: 10px 13px;
      cursor: pointer
    }

    .btn.alt {
      background: #e8eff6;
      color: #36506d
    }

    .btn.red {
      background: #fdeaea;
      color: #b63c3c
    }

    .btn.warn {
      background: #fff0dc;
      color: #995200
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    .search {
      border: 1px solid #ccd9e5;
      background: #fff;
      border-radius: 8px;
      padding: 10px 11px;
      min-width: 230px
    }

    .notice {
      background: #fff7dc;
      border: 1px solid #f0dd9c;
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 16px;
      line-height: 1.45
    }

    .oknotice {
      background: #e9faf5;
      border: 1px solid #a6e1ce;
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 16px;
      line-height: 1.45
    }

    .tablebox {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid #e9eff4;
      text-align: left;
      vertical-align: top
    }

    th {
      font-size: 12px;
      color: #5d7188;
      background: #f7f9fb;
      white-space: nowrap
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: bold;
      background: #eaf1ff;
      color: #3864b2
    }

    .tag.green {
      background: #e3f7ee;
      color: #167b55
    }

    .tag.gold {
      background: #fff0c6;
      color: #916200
    }

    .tag.red {
      background: #fdeaea;
      color: #b43a3a
    }

    .upload {
      border: 2px dashed #8ebcab;
      border-radius: 11px;
      background: #fafffd;
      padding: 28px;
      text-align: center
    }

    .filelabel {
      display: inline-block;
      border: 0;
      border-radius: 8px;
      background: #e8eff6;
      color: #36506d;
      font-weight: bold;
      padding: 10px 14px;
      cursor: pointer
    }

    .fileinput {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0)
    }

    .filename {
      font-weight: bold;
      margin: 13px 0 8px;
      min-height: 18px
    }

    .importstatus {
      margin-top: 12px;
      font-weight: bold
    }

    .modalbg {
      position: fixed;
      inset: 0;
      background: #07172799;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 18px
    }

    .modal {
      position: relative;
      max-width: 850px;
      width: 100%;
      background: #fff;
      border-radius: 13px;
      padding: 22px;
      box-shadow: 0 25px 65px #0005;
      max-height: 90vh;
      overflow: auto
    }

    .modal h2 {
      margin: 0 35px 12px 0;
      font-size: 20px
    }

    .xclose {
      position: absolute;
      right: 14px;
      top: 11px;
      border: 0;
      background: transparent;
      color: #64778c;
      font-size: 27px;
      cursor: pointer
    }

    .actions {
      margin-top: 17px;
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap
    }

    .detailgrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0
    }

    .field {
      background: #f7f9fb;
      border: 1px solid #e4ebf2;
      border-radius: 8px;
      padding: 9px
    }

    .field b {
      display: block;
      font-size: 11px;
      color: #60758b;
      margin-bottom: 3px
    }

    .formgrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px
    }

    .formgrid label {
      font-size: 12px;
      font-weight: bold;
      color: #50657b
    }

    .formgrid input,
    .formgrid select,
    .formgrid textarea {
      width: 100%;
      padding: 9px;
      border: 1px solid #cdd9e4;
      border-radius: 7px;
      margin-top: 5px;
      font: 14px inherit
    }

    .formgrid textarea {
      min-height: 75px
    }

    .full {
      grid-column: 1/-1
    }

    .backupgrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px
    }

    .backupcard {
      border: 1px solid #dce6ef;
      border-radius: 11px;
      padding: 17px;
      background: #fbfdff
    }

    .backupcard h3 {
      margin: 0 0 8px;
      font-size: 16px
    }

    .backupcard p {
      line-height: 1.45;
      color: #586d83
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 16px
    }

    .filters button {
      border: 1px solid #cfdce7;
      background: #fff;
      color: #486078;
      border-radius: 7px;
      padding: 8px 10px;
      font-weight: bold;
      cursor: pointer
    }

    .filters button.active {
      background: #102038;
      color: #fff
    }

    .mobile {
      display: none
    }

    .devis-form {
      max-width: 760px;
      margin: auto
    }

    .devis-form .formgrid {
      gap: 14px
    }

    .devis-form label {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: .35px;
      color: #5d7188;
      text-transform: uppercase
    }

    .devis-form .formgrid input,
    .devis-form .formgrid select {
      background: #f9fbfe;
      border-color: #dce5ee;
      padding: 11px;
      border-radius: 9px
    }

    .devis-form .quote-amount input {
      border: 2px solid #8bddd2;
      background: #f6fffd;
      color: #126f68;
      font-weight: bold
    }

    .client-address-card {
      grid-column: 1/-1;
      background: #eef3ff;
      border-radius: 12px;
      padding: 14px 16px;
      color: #26395f;
      line-height: 1.55
    }

    .client-address-card b {
      display: block;
      color: #566bb2;
      font-size: 11px;
      letter-spacing: .55px;
      text-transform: uppercase;
      margin-bottom: 5px
    }

    .chantier-description-card {
      grid-column: 1/-1;
      border: 2px solid #9a9687;
      background: #fffdf0;
      border-radius: 12px;
      padding: 14px 16px;
      color: #49483f;
      line-height: 1.55
    }

    .chantier-description-card b {
      display: block;
      color: #a56525;
      font-size: 11px;
      letter-spacing: .55px;
      text-transform: uppercase;
      margin-bottom: 8px
    }

    .chantier-description-card .quote-description {
      background: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      font-style: italic;
      font-weight: bold;
      color: #68717a;
      min-height: 20px
    }

    .devis-form .actions {
      border-top: 1px solid #e6edf3;
      padding-top: 16px;
      margin-top: 20px
    }

    .devis-form .actions .btn {
      padding: 11px 17px
    }

    .devis-form .actions .btn:not(.alt) {
      border-radius: 12px
    }

    .devis-form .quote-details {
      grid-column: 1/-1;
      margin-top: 2px;
      color: #60758b;
      font-size: 12px
    }

    .quote-services {
      grid-column: 1/-1;
      border: 1px solid #cfe1df;
      background: #f8fffd;
      border-radius: 12px;
      padding: 14px 16px
    }

    .quote-services>b {
      display: block;
      color: #126f68;
      font-size: 11px;
      letter-spacing: .55px;
      text-transform: uppercase;
      margin-bottom: 9px
    }

    .quote-service-list {
      display: grid;
      gap: 8px
    }

    .quote-service {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      border: 1px solid #dceae8;
      background: #fff;
      border-radius: 8px;
      padding: 9px 10px;
      cursor: pointer
    }

    .quote-service input {
      width: auto !important;
      margin-top: 3px
    }

    .quote-service span {
      flex: 1
    }

    .quote-service em {
      font-style: normal;
      font-weight: bold;
      color: #126f68;
      white-space: nowrap
    }

    .quote-service small {
      display: block;
      color: #687b90;
      margin-top: 3px;
      line-height: 1.35
    }

    .quote-summary {
      grid-column: 1/-1;
      border-top: 1px solid #dceae8;
      padding-top: 11px;
      color: #17324c;
      font-weight: bold
    }

    .quote-summary .small {
      font-weight: normal;
      color: #687b90;
      margin-top: 4px
    }

    .client-picker {
      position: relative
    }

    .client-picker input {
      width: 100%;
      box-sizing: border-box
    }

    .client-results {
      display: none;
      position: absolute;
      z-index: 80;
      left: 0;
      right: 0;
      top: 100%;
      max-height: 210px;
      overflow: auto;
      background: #fff;
      border: 1px solid #cdd9e4;
      border-radius: 8px;
      box-shadow: 0 8px 20px #17324c22;
      margin-top: 3px
    }

    .client-results.open {
      display: block
    }

    .client-result {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid #edf1f5;
      background: #fff;
      padding: 9px 10px;
      cursor: pointer;
      font: inherit;
      color: #17324c
    }

    .client-result:hover {
      background: #e9faf5
    }

    .client-result small {
      display: block;
      color: #687b90;
      margin-top: 2px
    }

    .client-empty {
      padding: 10px;
      color: #687b90;
      font-size: 12px
    }

    @media(max-width:900px) {
      .side {
        transform: translateX(-100%);
        transition: .2s
      }

      .side.open {
        transform: none
      }

      .main {
        margin-left: 0
      }

      .mobile {
        display: block;
        border: 0;
        background: #eef3f7;
        border-radius: 7px;
        padding: 7px 10px;
        font-size: 18px;
        margin-right: 10px
      }

      .top {
        padding: 0 14px
      }

      .page {
        padding: 17px
      }

      .metrics,
      .twocol {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:600px) {

      .metrics,
      .twocol,
      .detailgrid,
      .formgrid,
      .backupgrid {
        grid-template-columns: 1fr
      }

      .right {
        display: none
      }

      .toolbar h1 {
        width: 100%;
        margin: 0
      }

      .search {
        width: 100%;
        min-width: 0
      }

      .page {
        padding: 13px
      }
    }

    .viewtoggle {
      display: flex;
      gap: 6px
    }

    .viewtoggle .activeview {
      background: #2cbfad;
      color: #fff;
      border-color: #2cbfad
    }

    .clientgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px
    }

    .clientcard {
      background: #fff;
      border: 1px solid #dce4ed;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(16, 32, 56, .05)
    }

    .clientcardhead {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start
    }

    .clientcard h3 {
      margin: 0 0 3px;
      font-size: 16px
    }

    .clientcard p {
      margin: 10px 0;
      min-height: 18px
    }

    .cardactions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      border-top: 1px solid #edf1f5;
      padding-top: 12px;
      margin-top: 12px
    }

    @media(max-width:700px) {
      .viewtoggle {
        order: 3;
        width: 100%
      }

      .clientgrid {
        grid-template-columns: 1fr
      }
    }

    .intfilters {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin: 0 0 15px
    }

    .intfilters button {
      border: 0;
      background: transparent;
      padding: 8px 10px;
      border-radius: 7px;
      color: #526474;
      font-weight: 700;
      cursor: pointer
    }

    .intfilters button.active {
      background: #102038;
      color: #fff
    }

    .intfilters input,
    .intfilters select {
      border: 1px solid #dce4ed;
      border-radius: 8px;
      padding: 9px 11px;
      background: #fff;
      min-width: 215px
    }

    .intfilters select {
      min-width: 190px
    }

    .agendahead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 12px 0
    }

    .agendahead h2 {
      margin: 0;
      font-size: 18px
    }

    .agendahead p {
      margin: 4px 0 0
    }

    .agendaactions {
      display: flex;
      align-items: center;
      gap: 7px
    }

    .agendaactions b {
      text-transform: capitalize;
      min-width: 125px;
      text-align: center
    }

    .calendar {
      border: 1px solid #dce4ed;
      border-radius: 12px;
      overflow: hidden;
      background: #fff
    }

    .calweek,
    .calgrid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr))
    }

    .calweek b {
      padding: 10px 7px;
      text-align: center;
      background: #f3f6f9;
      border-bottom: 1px solid #dce4ed;
      font-size: 12px;
      text-transform: uppercase
    }

    .calweek b:nth-child(6),
    .calweek b:nth-child(7) {
      background: #fffaf0
    }

    .calday {
      min-height: 132px;
      padding: 6px;
      border-right: 1px solid #e6ecf2;
      border-bottom: 1px solid #e6ecf2;
      background: #fff
    }

    .calday:nth-child(7n) {
      border-right: 0
    }

    .calday.other {
      background: #f8fafc
    }

    .caldate {
      font-size: 12px;
      font-weight: 700;
      color: #6b7b8d;
      margin: 2px 3px 6px
    }

    .calitem {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      border-left: 4px solid #7b90a8;
      border-radius: 7px;
      margin: 4px 0;
      padding: 5px 6px;
      background: #f2f5f8;
      cursor: pointer;
      color: #19324d;
      font: inherit
    }

    .calitem span {
      font-size: 10px;
      font-weight: 700;
      margin-right: 5px
    }

    .calitem b {
      display: block;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .calitem small {
      display: block;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .calitem em {
      display: inline-block;
      background: #276ef1;
      color: white;
      border-radius: 4px;
      padding: 1px 4px;
      font-style: normal;
      font-size: 9px;
      margin-top: 3px
    }

    .calitem.planned {
      background: #eaf3ff;
      border-left-color: #3478c9
    }

    .calitem.done {
      background: #eaf8ef;
      border-left-color: #2b9b63
    }

    .calitem.unpaid {
      background: #fde8e8;
      border-left-color: #ca4141;
      color: #862d2d
    }

    .calitem.unpaid em {
      background: #ca4141
    }

    .calitem.invoiced {
      background: #fff4df;
      border-left-color: #d78a19
    }

    .calitem.paid {
      background: #dff5e8;
      border-left-color: #14834b
    }

    .calitem.cancelled {
      background: #fde8e8;
      border-left-color: #ca4141
    }

    .calitem.rescheduled {
      background: #f0e9ff;
      border-left-color: #7d5ac7
    }

    @media(max-width:900px) {
      .calday {
        min-height: 96px
      }

      .calitem small {
        display: none
      }

      .agendahead {
        align-items: flex-start;
        flex-direction: column
      }

      .intfilters input {
        flex: 1
      }

      .calendar {
        overflow: auto
      }

      .calweek,
      .calgrid {
        min-width: 730px
      }
    }
  </style>
</head>

<body>
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">✦</div>
      <div><b>AlainB Pro</b><small>GOOGLE SHEETS — V5 Cloud</small></div>
    </div>

    <nav class="nav">
      <button data-p="dash" class="active">⌂ &nbsp; Tableau de bord</button>
      <button data-p="clients">♙ &nbsp; Clients</button>
      <button data-p="chantiers">▣ &nbsp; Chantiers</button>
      <button data-p="devis">▤ &nbsp; Devis</button>
      <button data-p="interventions">▣ &nbsp; Interventions</button>
      <button data-p="ca">◉ &nbsp; Chiffre d'affaires</button>

      <div class="cap">GESTION DOCUMENTAIRE</div>

      <button data-p="factures">▧ &nbsp; Factures</button>
      <button data-p="documents">▤ &nbsp; Documents comptables</button>
      <button data-p="backup">⇩ &nbsp; Sauvegarde & import</button>
      <button data-p="settings">⚙ &nbsp; Paramètres entreprise</button>
    </nav>

    <div class="foot">
      <b>Google Sheets Sync</b>
      <span id="status">● Connexion en cours...</span>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="mobile" id="menu">☰</button>
      <span class="soft">AlainB Pro Google</span>&nbsp; / &nbsp;<b id="pagetitle">Tableau de bord</b>

      <div class="right">
        <button class="btn alt" id="syncbtn" style="padding:6px 10px; font-size:12px;">🔄 Forcer Synchro Google Sheet</button>
        <div class="pill" id="datepill"></div>
        <div class="pill" id="countpill"></div>
      </div>
    </header>

    <div class="page" id="root"></div>
  </main>

  <div id="modal"></div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxlsmr0WpcAbbi59rzxu_ckS6m3GuZe51631OBNeMIsUz0Oxxmvv9d0I5oQJy07v2Kh9A/exec";
    const SECRET_KEY = "5569";

    const todayLocal = (() => {
      const d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    })();

    const S = {
      p: 'dash',
      filter: 'all',
      invoiceClient: '',
      d: {
        clients: [],
        chantiers: [],
        devis: [],
        interventions: [],
        relances: [],
        factures: [],
        settings: {}
      },
      file: 'Google Sheets Live',
      ref: todayLocal
    };

    const R = document.getElementById('root');
    const M = document.getElementById('modal');

    const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));

    const cid = x => String(x || '').trim().toUpperCase();
    const num = x => Number(String(x || 0).replace(',', '.').replace(/[^0-9.-]/g, '')) || 0;
    const eur = x => num(x).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });

    function fdate(x) {
      if (!x) return '—';
      const d = new Date(x + 'T12:00:00');
      return isNaN(d)
        ? x
        : new Intl.DateTimeFormat('fr-FR', {
            weekday: 'short',
            day: 'numeric',
            month: 'short',
            year: 'numeric'
          }).format(d);
    }

    function g(o, n) {
      for (let k in o) {
        if (n.some(a => a.toLowerCase() === k.toLowerCase())) {
          return String(o[k] ?? '').trim();
        }
      }
      return '';
    }

    function nd(v) {
      v = String(v || '').trim();
      let a = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (a) return a[1] + '-' + a[2].padStart(2, '0') + '-' + a[3].padStart(2, '0');
      a = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      return a ? a[3] + '-' + a[2].padStart(2, '0') + '-' + a[1].padStart(2, '0') : v;
    }

    function client(id) {
      return S.d.clients.find(x => cid(x.id) === cid(id));
    }

    function chantier(id) {
      return S.d.chantiers.find(x => cid(x.id) === cid(id));
    }

    function cname(id) {
      return client(id)?.name || id || 'Client inconnu';
    }

    function chname(id) {
      return chantier(id)?.name || id || 'Chantier inconnu';
    }

    function tag(x) {
      const s = String(x || '');
      const l = s.toLowerCase();
      const c =
        l.includes('régl') || l.includes('pay') || l.includes('accept') ? 'green' :
        l.includes('annul') || l.includes('refus') ? 'red' :
        l.includes('émis') || l.includes('envoy') || l.includes('factur') ? 'gold' : '';
      return '<span class="tag ' + c + '">' + esc(s || '—') + '</span>';
    }

    function active(a) {
      return a.filter(x => !x.archived);
    }

    function save() {
      localStorage.setItem('alainb_pro_data', JSON.stringify(S.d));
      localStorage.setItem('alainb_pro_file', S.file);
      triggerGoogleSheetsSync();
    }

    function pop(t, b) {
      M.innerHTML =
        '<div class="modalbg"><div class="modal"><button class="xclose" id="mx">×</button><h2>' +
        esc(t) +
        '</h2>' +
        b +
        '</div></div>';
      document.getElementById('mx').onclick = () => {
        M.innerHTML = '';
      };
    }

    function invoiceTotal(f) {
      return (f.interventions || [])
        .map(id => S.d.interventions.find(x => cid(x.id) === cid(id)))
        .filter(Boolean)
        .reduce((a, x) => a + num(x.amount), 0);
    }

    function unbilledInterventions(clientId) {
      return active(S.d.interventions).filter(i => cid(i.client) === cid(clientId) && !i.invoiceId);
    }

    function linkInvoices() {
      S.d.factures.forEach(f => {
        (f.interventions || []).forEach(id => {
          const x = S.d.interventions.find(y => cid(y.id) === cid(id));
          if (x) x.invoiceId = f.id;
        });
      });
    }

    function triggerGoogleSheetsSync() {
      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.innerText = "● Synchronisation en cours...";

      const sheetPayload = {
        clients: (S.d.clients || []).map(c => ({
          ID_Client: c.id || '',
          Nom_Affichage: c.name || '',
          Prenom: c.first || '',
          Nom: c.last || '',
          Entreprise: c.company || '',
          Statut_Client: c.status || 'Actif',
          Telephone: String(c.phone || ''),
          Email: c.email || '',
          Adresse_Ligne_1: c.street || '',
          Code_Postal: String(c.postal || ''),
          Ville: c.city || '',
          Canal_Obtention: c.source || '',
          Notes: c.notes || '',
          Archive: c.archived ? 'Oui' : 'Non'
        })),
        chantiers: (S.d.chantiers || []).map(c => ({
          ID_Chantier: c.id || '',
          ID_Client: c.client || '',
          Type_Chantier: c.name || '',
          Description_Technique: c.description || '',
          Prix_Defaut: c.price || 0,
          Duree_Estimee: c.duration || '',
          Statut_Chantier: c.status || '',
          Notes: c.notes || '',
          Archive: c.archived ? 'Oui' : 'Non'
        })),
        interventions: (S.d.interventions || []).map(i => ({
          ID_Intervention: i.id || '',
          ID_Client: i.client || '',
          ID_Chantier: i.chantier || '',
          Date_Intervention: i.date || '',
          Heure: i.hour || '',
          Duree_Reelle: i.duration || '',
          Montant: i.amount || 0,
          Statut_Intervention: i.status || '',
          ID_Facture: i.invoiceId || '',
          Notes: i.notes || '',
          Archive: i.archived ? 'Oui' : 'Non'
        })),
        devis: (S.d.devis || []).map(d => ({
          ID_Devis: d.id || '',
          ID_Client: d.client || '',
          ID_Chantier: d.chantier || '',
          Date_Creation: d.created || '',
          Montant_Total: d.amount || 0,
          Statut_Devis: d.status || '',
          Date_Visite: d.visitDate || '',
          Heure_Visite: d.visitHour || '',
          Notes: d.notes || '',
          Archive: d.archived ? 'Oui' : 'Non'
        })),
        factures: (S.d.factures || []).map(f => ({
          ID_Facture: f.id || '',
          ID_Client: f.client || '',
          Date_Facture: f.date || '',
          Statut_Facture: f.status || '',
          Mode_Paiement: f.payment || '',
          Date_Paiement: f.paidDate || '',
          Montant_Paye: f.paidAmount || 0,
          Notes: f.notes || '',
          Archive: f.archived ? 'Oui' : 'Non'
        })),
        relances: (S.d.relances || []).map(r => ({
          ID_Relance: r.id || '',
          ID_Client: r.client || '',
          Date_Relance: r.date || '',
          Canal: r.channel || '',
          Objet: r.subject || '',
          Notes: r.notes || ''
        })),
        settings: S.d.settings || {}
      };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          key: SECRET_KEY,
          action: 'syncAll',
          data: sheetPayload
        })
      })
        .then(async res => {
          const txt = await res.text();
          try {
            return JSON.parse(txt);
          } catch (e) {
            throw new Error(txt.slice(0, 300));
          }
        })
        .then(res => {
          if (!res || res.ok === false) {
            throw new Error((res && res.error) || 'Erreur Apps Script');
          }
          console.log('Synchronisé avec Google Sheets :', res);
          if (statusEl) statusEl.innerText = "● Connecté (Google Sheets)";
        })
        .catch(err => {
          console.error('Erreur de synchro Google Sheets :', err);
          if (statusEl) {
            statusEl.innerText = '● Erreur de synchro : ' + (err.message || err);
          }
        });
    }

    function loadFromGoogleSheets() {
      const statusEl = document.getElementById('status');

      if (statusEl) {
        statusEl.innerText = "● Chargement Google Sheets...";
      }

      const controller = new AbortController();

      const timeoutId = setTimeout(() => {
        controller.abort();
      }, 15000);

      fetch(API_URL + '?key=' + encodeURIComponent(SECRET_KEY), {
        method: 'GET',
        cache: 'no-store',
        signal: controller.signal
      })
        .then(async res => {
          clearTimeout(timeoutId);

          const txt = await res.text();

          try {
            return JSON.parse(txt);
          } catch (e) {
            throw new Error(
              'Réponse non JSON reçue par Google Sheets : ' +
              txt.slice(0, 300)
            );
          }
        })
        .then(data => {
          if (!data) {
            throw new Error('Réponse vide de Google Sheets');
          }

          if (data.ok === false) {
            throw new Error(data.error || 'Erreur Apps Script');
          }

          const sheets = data.sheets || data;

          S.d.clients = sheets.Clients || sheets.clients || [];
          S.d.chantiers = sheets.Chantiers || sheets.chantiers || [];
          S.d.devis = sheets.Devis || sheets.devis || [];
          S.d.interventions = sheets.Interventions || sheets.interventions || [];
          S.d.factures = sheets.Factures || sheets.factures || [];
          S.d.relances = sheets.Relances || sheets.relances || [];

          const settingsRows =
            sheets.Parametres ||
            sheets.parametres ||
            sheets.Settings ||
            sheets.settings ||
            [];

          if (Array.isArray(settingsRows)) {
            S.d.settings = settingsRows[0] || {};
          } else if (settingsRows && typeof settingsRows === 'object') {
            S.d.settings = settingsRows;
          } else {
            S.d.settings = {};
          }

          S.file = 'Google Sheets Live';
          localStorage.setItem('alainb_pro_data', JSON.stringify(S.d));

          if (statusEl) {
            statusEl.innerText = "● Connecté (Google Sheets)";
          }

          console.log('Réponse complète Google Sheets :', data);
          console.log('Objet sheets :', sheets);
          console.log('Données chargées :', S.d);
          console.log('Fonction render :', typeof render);

          try {
            if (typeof render !== 'function') {
              throw new Error('La fonction render() est introuvable');
            }

            render();
          } catch (renderError) {
            console.error('Erreur pendant le rendu de l’application :', renderError);

            if (statusEl) {
              statusEl.innerText =
                '● Erreur affichage : ' + (renderError.message || renderError);
            }

            const root = document.getElementById('root');

            if (root) {
              root.innerHTML =
                '<div style="padding:24px;margin:20px;background:#fff3f3;border:1px solid #d9534f;border-radius:8px;color:#8b1e1e;font-family:Arial,sans-serif;">' +
                '<h2>Erreur d\'affichage</h2>' +
                '<p>' + String(renderError.message || renderError) + '</p>' +
                '<p>Ouvrez la console du navigateur pour obtenir le détail.</p>' +
                '</div>';
            }
          }
        })
        .catch(err => {
          clearTimeout(timeoutId);

          if (err.name === 'AbortError') {
            console.error('Google Sheets n’a pas répondu dans les 15 secondes.');

            if (statusEl) {
              statusEl.innerText = '● Google Sheets trop lent ou inaccessible';
            }
          } else {
            console.error('Erreur Google Sheets :', err);

            if (statusEl) {
              statusEl.innerText =
                '● Erreur Google Sheets : ' + (err.message || err);
            }
          }

          fallbackLocal();
        });
    }

    function fallbackLocal() {
      const raw = localStorage.getItem('alainb_pro_data');
      if (raw) {
        try {
          S.d = JSON.parse(raw);
        } catch (e) {}
      }

      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.innerText = "● Mode hors-ligne (Local)";
      if (typeof render === 'function') render();
    }

    const syncBtn = document.getElementById('syncbtn');
    if (syncBtn) {
      syncBtn.onclick = () => {
        loadFromGoogleSheets();
      };
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadFromGoogleSheets();
    });
  </script>
</body>
</html>
