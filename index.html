<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlainB Pro — V1.6.41</title>
<style>
:root{--nav:#102038;--teal:#2cbfad;--bg:#f3f6fa;--ink:#1d2e44;--mut:#6b7e91;--line:#dfe7ef;--gold:#d99a19;--red:#d95c5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}
.side{position:fixed;inset:0 auto 0 0;width:245px;background:var(--nav);color:#e7f0fa}
.brand{height:77px;padding:18px;display:flex;gap:11px;align-items:center;border-bottom:1px solid #29425f}
.mark{width:34px;height:34px;border-radius:9px;background:var(--teal);display:grid;place-items:center;color:#09263a;font-size:19px;font-weight:bold}
.brand b{font-size:19px}
.brand small{display:block;font-size:10px;letter-spacing:1px;color:#9eb5ca;margin-top:3px}
.nav{padding:15px 10px}
.nav button{width:100%;border:0;background:transparent;color:#d6e3ef;padding:12px 14px;text-align:left;border-radius:8px;margin:2px 0;font-weight:bold;font-size:14px;cursor:pointer}
.nav button:hover,.nav button.active{background:var(--teal);color:#09283a}
.cap{border-top:1px solid #29425f;margin:16px 4px 8px;padding:16px 10px 0;color:#8399b0;font-size:10px;font-weight:bold;letter-spacing:1px}
.foot{position:absolute;bottom:0;left:0;right:0;border-top:1px solid #29425f;padding:15px;color:#b4c5d5;font-size:12px}
.foot span{display:block;color:#40d4b4;font-size:11px;margin-top:6px}
.main{margin-left:245px;min-height:100vh}
.top{height:60px;display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--line);padding:0 28px;font-weight:bold}
.soft{color:#62788f}
.right{margin-left:auto;display:flex;gap:8px}
.pill{padding:7px 10px;border:1px solid #d3dfeb;background:#f9fbfd;border-radius:8px;color:#526a83;font-size:12px}
.page{padding:28px;max-width:1600px;margin:auto}
.hero{background:linear-gradient(110deg,#102038,#0b1c31);border-radius:14px;padding:25px 28px;color:#fff;margin-bottom:23px}
.eyebrow{font-size:11px;font-weight:bold;letter-spacing:1px;color:var(--teal)}
.hero h1{margin:6px 0;font-size:25px}
.hero p{margin:0;color:#d7e4ef;line-height:1.5}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(155px,1fr));gap:16px;margin-bottom:24px}
.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 6px 22px #1635530c}
.label{font-weight:bold;color:#687b90}
.value{font-size:27px;font-weight:bold;margin:7px 0 3px;color:#17324c}
.teal{color:#129984}
.small{font-size:12px;color:var(--mut)}
.panel h2{font-size:16px;margin:0}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:10px}
.link{border:0;background:none;color:#129984;font-weight:bold;cursor:pointer}
.twocol{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}
.item{border:1px solid #e2eaf1;border-radius:9px;padding:11px 13px;margin:8px 0;background:#fff}
.item.late{border-left:4px solid var(--red);background:#fff8f8}
.item.soon{border-left:4px solid var(--gold);background:#fffdf4}
.item.ok{border-left:4px solid var(--teal);background:#f8fffd}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:17px}
.toolbar h1{font-size:24px;margin:0 auto 0 0}
.btn{border:0;border-radius:8px;background:var(--teal);color:#09283a;font-weight:bold;padding:10px 13px;cursor:pointer}
.btn.alt{background:#e8eff6;color:#36506d}
.btn.red{background:#fdeaea;color:#b63c3c}
.btn.warn{background:#fff0dc;color:#995200}
.btn:disabled{opacity:.55;cursor:not-allowed}
.search{border:1px solid #ccd9e5;background:#fff;border-radius:8px;padding:10px 11px;min-width:230px}
.tablebox{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:11px 12px;border-bottom:1px solid #e9eff4;text-align:left;vertical-align:top}
th{font-size:12px;color:#5d7188;background:#f7f9fb;white-space:nowrap}
.tag{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:bold;background:#eaf1ff;color:#3864b2}
.tag.green{background:#e3f7ee;color:#167b55}
.tag.gold{background:#fff0c6;color:#916200}
.tag.red{background:#fdeaea;color:#b43a3a}
.modalbg{position:fixed;inset:0;background:#07172799;z-index:50;display:grid;place-items:center;padding:18px}
.modal{position:relative;max-width:850px;width:100%;background:#fff;border-radius:13px;padding:22px;box-shadow:0 25px 65px #0005;max-height:90vh;overflow:auto}
.modal h2{margin:0 35px 12px 0;font-size:20px}
.xclose{position:absolute;right:14px;top:11px;border:0;background:transparent;color:#64778c;font-size:27px;cursor:pointer}
.actions{margin-top:17px;display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid label{font-size:12px;font-weight:bold;color:#50657b}
.formgrid input,.formgrid select,.formgrid textarea{width:100%;padding:9px;border:1px solid #cdd9e4;border-radius:7px;margin-top:5px;font:14px inherit}
.formgrid textarea{min-height:75px}
.full{grid-column:1/-1}
.clientgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.clientcard{background:#fff;border:1px solid #dce4ed;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(16,32,56,.05)}
.clientcardhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.clientcard h3{margin:0 0 3px;font-size:16px}
.clientcard p{margin:10px 0;min-height:18px}
.cardactions{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid #edf1f5;padding-top:12px;margin-top:12px}
@media(max-width:900px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin-left:0}.mobile{display:block;border:0;background:#eef3f7;border-radius:7px;padding:7px 10px;font-size:18px;margin-right:10px}.top{padding:0 14px}.page{padding:17px}.metrics,.twocol{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><div class="mark">✦</div><div><b>AlainB Pro</b><small>CLOUD GOOGLE SHEETS — V15</small></div></div>
  <nav class="nav">
    <button data-p="dash" class="active">⌂ &nbsp; Tableau de bord</button>
    <button data-p="clients">♙ &nbsp; Clients</button>
    <button data-p="chantiers">▣ &nbsp; Chantiers</button>
    <button data-p="devis">▤ &nbsp; Devis</button>
    <button data-p="interventions">▣ &nbsp; Interventions</button>
    <button data-p="ca">◉ &nbsp; Chiffre d'affaires</button>
    <div class="cap">GESTION DOCUMENTAIRE</div>
    <button data-p="factures">▧ &nbsp; Factures</button>
    <button data-p="documents">▤ &nbsp; Documents comptables</button>
    <button data-p="settings">⚙ &nbsp; Paramètres entreprise</button>
  </nav>
  <div class="foot"><b>Mode Cloud Google Sheets</b><span id="status">● Connexion active</span></div>
</aside>

<main class="main">
  <header class="top">
    <button class="mobile" id="menu">☰</button>
    <span class="soft">AlainB Pro Cloud</span>&nbsp; / &nbsp;<b id="pagetitle">Tableau de bord</b>
    <div class="right">
      <div class="pill" id="datepill"></div>
      <div class="pill" id="countpill"></div>
    </div>
  </header>
  <div class="page" id="root"></div>
</main>
<div id="modal"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script>
  // URL de votre script Google Apps Script de référence
  const API_URL = "https://script.google.com/macros/s/AKfycbyovnX4Taq8vX7gtW3t5b7pu1Ky5z-8LTFN5q1Bz4YqD3ID6mJiz34Pfj99CC9tFmHk/exec"; //V15

  const todayLocal = (() => { let d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') })();
  const S = { p: 'dash', filter: 'all', invoiceClient: '', d: { clients: [], chantiers: [], devis: [], interventions: [], relances: [], factures: [], parametres: [] }, ref: todayLocal };
  
  const R = document.getElementById('root'), M = document.getElementById('modal');
  const esc = x => String(x??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;P'[c]||c}));
  const cid = x => String(x||'').trim().toUpperCase();
  const num = x => Number(String(x||0).replace(',','.').replace(/[^0-9.-]/g,''))||0;
  const eur = x => num(x).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});

  function fdate(x) {
    if(!x) return '—';
    let d = new Date(x+'T12:00:00');
    return isNaN(d) ? x : new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(d);
  }

  function cname(id) {
    let found = (S.d.clients || []).find(x => cid(x.id) === cid(id));
    return found ? (found.name || found.company || id) : (id || 'Client inconnu');
  }

  function chname(id) {
    let found = (S.d.chantiers || []).find(x => cid(x.id) === cid(id));
    return found ? (found.name || id) : (id || 'Chantier inconnu');
  }

  function tag(x) {
    let s = String(x||''), l = s.toLowerCase();
    let c = l.includes('régl') || l.includes('pay') || l.includes('accept') ? 'green' : l.includes('annul') || l.includes('refus') ? 'red' : l.includes('émis') || l.includes('envoy') || l.includes('factur') ? 'gold' : '';
    return '<span class="tag '+c+'">'+esc(s||'—')+'</span>';
  }

  function active(a) {
    return (a || []).filter(x => !x.archived);
  }

  // --- CHARGEMENT INITIAL DEPUIS GOOGLE SHEETS ---
  function loadAppData() {
    document.getElementById('status').textContent = '● Chargement des données...';
    fetch(API_URL)
      .then(res => res.json())
      .then(result => {
        if(result.status === "success" && result.data) {
          S.d = {
            clients: result.data.clients || [],
            chantiers: result.data.chantiers || [],
            interventions: result.data.interventions || [],
            devis: result.data.devis || [],
            factures: result.data.factures || [],
            relances: result.data.relances || [],
            parametres: result.data.parametres || []
          };
          document.getElementById('status').textContent = '● Connecté à Google Sheets';
          if(typeof render === 'function') render();
        } else {
          console.error("Erreur serveur :", result.message);
          document.getElementById('status').textContent = '● Erreur de chargement';
        }
      })
      .catch(err => {
        console.error("Erreur réseau :", err);
        document.getElementById('status').textContent = '● Hors ligne / Erreur';
      });
  }

  // --- SAUVEGARDE SYNCHRONISÉE VERS GOOGLE SHEETS ---
  function save() {
    if(typeof render === 'function') render(); // Rafraîchissement visuel instantané

    const payload = {
      action: 'syncAll',
      data: S.d 
    };

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      console.log("Synchronisation Google Sheets réussie :", res);
    })
    .catch(err => {
      console.error("Erreur de synchronisation Google Sheets :", err);
    });
  }

  function triggerGoogleSheetsSync() {
    setTimeout(() => { save(); }, 500);
  }

  document.addEventListener('click', function(e) {
    const target = e.target.closest('button') || e.target;
    if(target) {
      const text = (target.innerText || target.textContent || '').toLowerCase();
      if(text.includes('enregistrer') || text.includes('valider') || text.includes('créer') || text.includes('modifier')) {
        triggerGoogleSheetsSync();
      }
    }
  }, true);

  // Rendu de base du Tableau de Bord pour s'assurer que l'interface s'affiche correctement
  function render() {
    document.getElementById('pagetitle').textContent = "Tableau de bord";
    document.getElementById('datepill').textContent = fdate(todayLocal);
    document.getElementById('countpill').textContent = (S.d.clients.length) + " clients";

    let paid = active(S.d.interventions).filter(x => String(x.status).toLowerCase().includes('pay')).reduce((a,x)=>a+num(x.amount),0);
    let clientsCount = active(S.d.clients).length;
    let plans = active(S.d.interventions).filter(x => String(x.status).toLowerCase().includes('plan'));

    R.innerHTML = `
      <div class="hero">
        <div class="eyebrow">ALAINB PRO — V1.6.41</div>
        <h1>Tableau de bord – Alain B Pro Vitres</h1>
        <p>Suivi de l’activité et synchronisation en direct avec Google Sheets.</p>
      </div>
      <div class="metrics">
        <div class="card"><div class="label">Chiffre d’affaires encaissé</div><div class="value teal">${eur(paid)}</div><div class="small">Interventions payées</div></div>
        <div class="card"><div class="label">Clients actifs</div><div class="value">${clientsCount}</div><div class="small">Enregistrés dans le cloud</div></div>
        <div class="card"><div class="label">Planification</div><div class="value">${plans.length}</div><div class="small">Interventions prévues</div></div>
      </div>
    `;
  }

  // Lancement au démarrage de la page
  window.onload = function() {
    loadAppData();
  };
</script>
</body>
</html>
