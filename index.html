<script>
  // Remplacez cette URL par votre lien d'exécution Google Apps Script
  const API_URL = "https://script.google.com/macros/s/AKfycbyp1FZYrDgsD7JLTnEYnjnISWJfb3LF7Pl95gHo-XQmbEmZsfeuq_jM5s6hnY2MJJhu/exec"; //V5

  // 1. Mappage Google Sheets -> JSON Application
  function mapSheetRowToJSON(entity, row) {
    if (!row) return {};
    
    if (entity === 'clients') {
      return {
        id: row.ID_Client || row.id || '',
        name: row.Nom_Affichage || row.name || '',
        first: row.Prenom || row.first || '',
        last: row.Nom || row.last || '',
        company: row.Entreprise || row.company || '',
        status: row.Statut_Client || row.status || 'Actif',
        phone: String(row.Telephone || row.phone || ''),
        email: row.Email || row.email || '',
        street: row.Adresse_Ligne_1 || row.street || '',
        postal: String(row.Code_Postal || row.postal || ''),
        city: row.Ville || row.city || '',
        source: row.Canal_Obtention || row.source || row.canal || '',
        notes: row.Notes || row.notes || '',
        archived: row.Archive === 'Oui' || row.archived === true
      };
    }
    
    if (entity === 'chantiers') {
      return {
        id: row.ID_Chantier || row.id || '',
        client: row.ID_Client || row.client || '',
        name: row.Nom_Chantier || row.name || '',
        description: row.Description || row.description || '',
        price: Number(row.Tarif_HT || row.price || 0),
        duration: String(row.Duree_Estimee || row.duration || ''),
        status: row.Statut_Chantier || row.status || 'À planifier',
        notes: row.Notes || row.notes || '',
        archived: row.Archive === 'Oui' || row.archived === true
      };
    }

    if (entity === 'interventions') {
      return {
        id: row.ID_Intervention || row.id || '',
        client: row.ID_Client || row.client || '',
        chantier: row.ID_Chantier || row.chantier || '',
        date: row.Date_Intervention || row.date || '',
        hour: row.Heure || row.hour || '',
        duration: String(row.Duree_Reelle || row.duration || ''),
        amount: Number(row.Montant || row.amount || 0),
        status: row.Statut_Intervention || row.status || 'Planifiée',
        invoiceId: row.ID_Facture || row.invoiceId || '',
        notes: row.Notes || row.notes || '',
        archived: row.Archive === 'Oui' || row.archived === true
      };
    }

    if (entity === 'devis') {
      return {
        id: row.ID_Devis || row.id || '',
        client: row.ID_Client || row.client || '',
        chantier: row.ID_Chantier || row.chantier || '',
        chantiers: row.Chantiers ? String(row.Chantiers).split(',') : (row.chantiers || []),
        created: row.Date_Creation || row.created || '',
        amount: Number(row.Montant_Total || row.amount || 0),
        status: row.Statut_Devis || row.status || 'En cours',
        visitDate: row.Date_Visite || row.visitDate || '',
        visitHour: row.Heure_Visite || row.visitHour || '',
        notes: row.Notes || row.notes || '',
        archived: row.Archive === 'Oui' || row.archived === true
      };
    }

    if (entity === 'factures') {
      return {
        id: row.ID_Facture || row.id || '',
        client: row.ID_Client || row.client || '',
        date: row.Date_Facture || row.date || '',
        interventions: row.Interventions ? String(row.Interventions).split(',') : (row.interventions || []),
        status: row.Statut_Facture || row.status || 'Émise',
        payment: row.Mode_Paiement || row.payment || '',
        paidDate: row.Date_Paiement || row.paidDate || '',
        paidAmount: Number(row.Montant_Paye || row.paidAmount || 0),
        notes: row.Notes || row.notes || '',
        archived: row.Archive === 'Oui' || row.archived === true
      };
    }

    if (entity === 'relances') {
      return {
        id: row.ID_Relance || row.id || '',
        client: row.ID_Client || row.client || '',
        date: row.Date_Relance || row.date || '',
        channel: row.Canal || row.channel || '',
        subject: row.Objet || row.subject || '',
        notes: row.Notes || row.notes || ''
      };
    }

    return row;
  }

  // 2. Synchronisation initiale au chargement (Google Sheets -> App)
  async function syncAndImport() {
    try {
      console.log("Chargement initial depuis Google Sheets...");
      const response = await fetch(API_URL);
      const rawData = await response.json();

      const formattedData = {
        clients: (rawData.clients || []).map(r => mapSheetRowToJSON('clients', r)),
        chantiers: (rawData.chantiers || []).map(r => mapSheetRowToJSON('chantiers', r)),
        devis: (rawData.devis || []).map(r => mapSheetRowToJSON('devis', r)),
        interventions: (rawData.interventions || []).map(r => mapSheetRowToJSON('interventions', r)),
        relances: (rawData.relances || []).map(r => mapSheetRowToJSON('relances', r)),
        factures: (rawData.factures || []).map(r => mapSheetRowToJSON('factures', r)),
        settings: (rawData.settings && rawData.settings[0]) ? rawData.settings[0] : {}
      };

      const jsonStr = JSON.stringify(formattedData);
      localStorage.setItem("alainb_pro_data", jsonStr);
      localStorage.setItem("AlainBProData", jsonStr);

      if (typeof importJsonFile === 'function') {
        const file = new File([jsonStr], "backup.json", { type: "application/json" });
        importJsonFile(file);
      } else if (typeof importFile === 'function') {
        const file = new File([jsonStr], "backup.json", { type: "application/json" });
        importFile(file);
      }

      if (typeof render === 'function') {
        render();
      }
      console.log("Importation initiale réussie !");
    } catch (error) {
      console.error("Erreur d'importation Google Sheets :", error);
    }
  }

  window.addEventListener("DOMContentLoaded", syncAndImport);

  // 3. Synchronisation directe par lecture du formulaire ouvert
  function triggerGoogleSheetsSync() {
    setTimeout(() => {
      try {
        const rawStorage = localStorage.getItem('alainb_pro_data') || localStorage.getItem('AlainBProData');
        const currentData = JSON.parse(rawStorage || '{}');

        const modalEl = document.querySelector('.modal, div[class*="modal"], div[class*="dialog"], form');
        let clientId = "";
        let sourceValue = "";

        if (modalEl) {
          const idInput = modalEl.querySelector('input[value^="CLI-"], input[value^="LOU"], input[name="id"]');
          if (idInput) clientId = idInput.value;

          const selectSource = modalEl.querySelector('select');
          if (selectSource) sourceValue = selectSource.value;
        }

        if (currentData.clients) {
          currentData.clients = currentData.clients.map(c => {
            if ((clientId && c.id === clientId) || currentData.clients.length === 1) {
              if (sourceValue) c.source = sourceValue;
            }
            return {
              ID_Client: c.id || '',
              Nom_Affichage: c.name || '',
              Prenom: c.first || '',
              Nom: c.last || '',
              Entreprise: c.company || '',
              Statut_Client: c.status || 'Actif',
              Telephone: String(c.phone || ''),
              Email: c.email || '',
              Adresse_Ligne_1: c.street || '',
              Code_Postal: String(c.postal || ''),
              Ville: c.city || '',
              Canal_Obtention: c.source || c.origin || c.canal || '',
              Notes: c.notes || '',
              Archive: c.archived ? 'Oui' : 'Non'
            };
          });
        }

        const sheetPayload = {
          clients: currentData.clients || [],
          chantiers: (currentData.chantiers || []).map(c => ({
            ID_Chantier: c.id || '',
            ID_Client: c.client || '',
            Nom_Chantier: c.name || '',
            Description: c.description || '',
            Tarif_HT: c.price || 0,
            Duree_Estimee: c.duration || '',
            Statut_Chantier: c.status || '',
            Notes: c.notes || '',
            Archive: c.archived ? 'Oui' : 'Non'
          })),
          interventions: (currentData.interventions || []).map(i => ({
            ID_Intervention: i.id || '',
            ID_Client: i.client || '',
            ID_Chantier: i.chantier || '',
            Date_Intervention: i.date || '',
            Heure: i.hour || '',
            Duree_Reelle: i.duration || '',
            Montant: i.amount || 0,
            Statut_Intervention: i.status || '',
            ID_Facture: i.invoiceId || '',
            Notes: i.notes || '',
            Archive: i.archived ? 'Oui' : 'Non'
          })),
          devis: (currentData.devis || []).map(d => ({
            ID_Devis: d.id || '',
            ID_Client: d.client || '',
            ID_Chantier: d.chantier || '',
            Date_Creation: d.created || '',
            Montant_Total: d.amount || 0,
            Statut_Devis: d.status || '',
            Date_Visite: d.visitDate || '',
            Heure_Visite: d.visitHour || '',
            Notes: d.notes || '',
            Archive: d.archived ? 'Oui' : 'Non'
          })),
          factures: (currentData.factures || []).map(f => ({
            ID_Facture: f.id || '',
            ID_Client: f.client || '',
            Date_Facture: f.date || '',
            Statut_Facture: f.status || '',
            Mode_Paiement: f.payment || '',
            Date_Paiement: f.paidDate || '',
            Montant_Paye: f.paidAmount || 0,
            Notes: f.notes || '',
            Archive: f.archived ? 'Oui' : 'Non'
          })),
          relances: (currentData.relances || []).map(r => ({
            ID_Relance: r.id || '',
            ID_Client: r.client || '',
            Date_Relance: r.date || '',
            Canal: r.channel || '',
            Objet: r.subject || '',
            Notes: r.notes || ''
          }))
        };

        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'syncAll', data: sheetPayload })
        }).then(res => res.json())
          .then(res => console.log("Google Sheets mis à jour en direct :", res))
          .catch(err => console.error("Erreur sync :", err));
      } catch (e) {
        console.error("Erreur préparation :", e);
      }
    }, 400);
  }

  // Écoute de tous les clics de validation
  document.addEventListener('click', function(e) {
    const target = e.target.closest('button') || e.target;
    if (target) {
      const text = (target.innerText || target.textContent || '').toLowerCase();
      if (
        text.includes('enregistrer') || 
        text.includes('valider') || 
        text.includes('créer') || 
        text.includes('modifier') || 
        text.includes('plus tard') ||
        target.tagName === 'BUTTON'
      ) {
        triggerGoogleSheetsSync();
      }
    }
  }, true);

  // Interception native du stockage local
  const originalSetItem = localStorage.setItem;
  localStorage.setItem = function(key, value) {
    originalSetItem.apply(this, arguments);
    if (key === 'alainb_pro_data' || key === 'AlainBProData') {
      triggerGoogleSheetsSync();
    }
  };
</script>
