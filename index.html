<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlainB Pro Vitres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f3ef;
      --surface: #ffffff;
      --surface-soft: #f0ece6;
      --line: #ddd4ca;
      --text: #221f1b;
      --muted: #6d655d;
      --primary: #0f6d73;
      --primary-dark: #0b5458;
      --danger: #a23a4a;
      --success: #3f7d32;
      --warning: #ab6a12;
      --radius: 16px;
      --shadow: 0 18px 40px rgba(35, 28, 21, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    aside {
      background: #1f1b18;
      color: #f4f1ec;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0f6d73, #88b8bb);
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .brand small { color: rgba(244,241,236,0.68); }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button {
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .nav button.active,
    .nav button:hover {
      background: rgba(255,255,255,0.08);
    }

    main {
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .topbar h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
    }

    .topbar p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.primary,
    button.secondary,
    button.danger {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary { background: var(--primary); color: white; }
    button.primary:hover { background: var(--primary-dark); }
    button.secondary { background: var(--surface-soft); color: var(--text); }
    button.danger { background: #f5d9dd; color: #7d1f2e; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }

    .card strong {
      display: block;
      font-size: 28px;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar .left,
    .toolbar .right {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      background: #fff;
      font: inherit;
      color: inherit;
    }

    input.search {
      min-width: 260px;
      background: var(--surface);
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: auto;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #ece5dc;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #faf8f5;
      position: sticky;
      top: 0;
      z-index: 1;
      font-size: 12px;
      letter-spacing: .02em;
      color: var(--muted);
      text-transform: uppercase;
    }

    tr:hover td {
      background: #fcfbf9;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      background: #e5f0ef;
      color: #15585c;
    }

    .badge.warning { background: #f6ead7; color: #8a5410; }
    .badge.danger { background: #f8dde1; color: #8e2437; }
    .badge.success { background: #deeed6; color: #2d6c20; }

    .hidden { display: none !important; }

    .panel {
      display: grid;
      gap: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-grid .full { grid-column: 1 / -1; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 15, 12, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(920px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 30px 60px rgba(0,0,0,.18);
      display: grid;
      gap: 16px;
    }

    .modal header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
    }

    .muted { color: var(--muted); }

    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 1024px) {
      .app { grid-template-columns: 1fr; }
      aside { padding-bottom: 10px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      main { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: stretch; }
      input.search { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="brand-logo">AB</div>
        <div>
          <strong>AlainB Pro Vitres</strong>
          <small id="companyMeta">Base live Google Sheets</small>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>
    </aside>

    <main>
      <section class="topbar">
        <div>
          <h1 id="pageTitle">Tableau de bord</h1>
          <p id="pageSubtitle">Gestion clients, chantiers, devis, interventions et factures.</p>
        </div>
        <div class="actions">
          <button class="secondary" id="refreshBtn">Actualiser</button>
          <button class="primary" id="newBtn">Nouveau</button>
        </div>
      </section>

      <section class="grid" id="stats"></section>

      <section class="panel card">
        <div class="toolbar">
          <div class="left">
            <input class="search" id="searchInput" type="search" placeholder="Rechercher dans la vue active..." />
          </div>
          <div class="right" id="toolbarActions"></div>
        </div>

        <div class="table-wrap" id="tableWrap"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <header>
        <div>
          <h2 id="modalTitle" style="margin:0">Nouvel enregistrement</h2>
          <p id="modalSubtitle" class="muted" style="margin:6px 0 0">Création ou modification d'une ligne.</p>
        </div>
        <button class="secondary" id="closeModalBtn">Fermer</button>
      </header>

      <form id="recordForm" class="form-grid"></form>

      <div class="actions" style="justify-content:flex-end">
        <button class="secondary" type="button" id="cancelBtn">Annuler</button>
        <button class="primary" type="submit" form="recordForm" id="saveBtn">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    const APP_CONFIG = {
      apiUrl: 'https://script.google.com/macros/s/AKfycbx6MwM2IiBi5o_rDjtPVJaR6v53pZZclmScavyc_6To4W8r6_4W6xThYmukNzPTWaE/exec',
      views: {
        clients: { sheet: 'Clients', label: 'Clients' },
        chantiers: { sheet: 'Chantiers', label: 'Chantiers' },
        devis: { sheet: 'Devis', label: 'Devis' },
        interventions: { sheet: 'Interventions', label: 'Interventions' },
        factures: { sheet: 'Factures', label: 'Factures' },
        relances: { sheet: 'Relances', label: 'Relances' }
      },
      idFields: {
        Clients: 'ID_Client',
        Chantiers: 'ID_Chantier',
        Devis: 'ID_Devis',
        Interventions: 'ID_Intervention',
        Factures: 'ID_Facture',
        Relances: 'ID_Relance'
      },
      fieldOrder: {
        Clients: ['ID_Client','Nom_Affichage','Prenom','Nom','Entreprise','Statut_Client','Telephone','Email','Adresse_Ligne_1','Code_Postal','Ville','Canal_Obtention','Notes','Archive'],
        Chantiers: ['ID_Chantier','ID_Client','Type_Chantier','Description_Technique','Prix_Defaut','Duree_Estimee','Statut_Chantier','Notes','Archive'],
        Devis: ['ID_Devis','ID_Client','ID_Chantier','ID_Chantiers','Date_Creation','Montant','Statut_Devis','Date_Visite','Heure_Visite','Notes','Archive'],
        Interventions: ['ID_Intervention','ID_Client','ID_Chantier','Date_Prevue','Heure','Duree_Estimee','Montant_Encaisse','Statut_Intervention','ID_Facture','Notes','Archive'],
        Factures: ['ID_Facture','ID_Client','Date_Facture','Interventions','Montant_Total_HT','Statut_Facture','Mode_Reglement','Date_Encaissement','Montant_Encaisse','Notes','Archive'],
        Relances: ['ID_Relance','ID_Client','Date_Relance','Canal','Suivi_Relance','Objet','Notes']
      }
    };

    const state = {
      activeView: 'clients',
      data: {
        clients: [], chantiers: [], devis: [], interventions: [], factures: [], relances: [], parametres: {}
      },
      filtered: [],
      editRecord: null
    };

    const els = {
      nav: document.getElementById('nav'),
      stats: document.getElementById('stats'),
      tableWrap: document.getElementById('tableWrap'),
      pageTitle: document.getElementById('pageTitle'),
      pageSubtitle: document.getElementById('pageSubtitle'),
      searchInput: document.getElementById('searchInput'),
      toolbarActions: document.getElementById('toolbarActions'),
      refreshBtn: document.getElementById('refreshBtn'),
      newBtn: document.getElementById('newBtn'),
      modalBackdrop: document.getElementById('modalBackdrop'),
      modalTitle: document.getElementById('modalTitle'),
      modalSubtitle: document.getElementById('modalSubtitle'),
      recordForm: document.getElementById('recordForm'),
      closeModalBtn: document.getElementById('closeModalBtn'),
      cancelBtn: document.getElementById('cancelBtn'),
      companyMeta: document.getElementById('companyMeta')
    };

    function badgeClass(value) {
      const v = String(value || '').toLowerCase();
      if (['payée','payé','actif','accepté','terminée'].includes(v)) return 'badge success';
      if (['prospect','à planifier','émise','en cours','planifiée'].includes(v)) return 'badge warning';
      if (['refusé','annulée','inactif','archivé'].includes(v)) return 'badge danger';
      return 'badge';
    }

    function formatCell(key, value) {
      if (value === null || value === undefined || value === '') return '';
      if (/^statut/i.test(key) || key === 'Archive') return `<span class="${badgeClass(value)}">${escapeHtml(value)}</span>`;
      if (/montant/i.test(key) || /prix/i.test(key)) {
        const n = Number(value);
        return Number.isFinite(n) ? `${n.toFixed(2)} €` : escapeHtml(value);
      }
      return escapeHtml(String(value)).replace(/\n/g, '<br>');
    }

    function escapeHtml(value) {
      return value
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function apiGet(params = {}) {
      const url = new URL(APP_CONFIG.apiUrl);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      const response = await fetch(url.toString());
      const json = await response.json();
      if (!json.success) throw new Error(json.error || 'Erreur API');
      return json;
    }

    async function apiPost(payload) {
      const response = await fetch(APP_CONFIG.apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const json = await response.json();
      if (!json.success) throw new Error(json.error || 'Erreur API');
      return json;
    }

    function renderNav() {
      els.nav.innerHTML = Object.entries(APP_CONFIG.views).map(([key, view]) => `
        <button class="${state.activeView === key ? 'active' : ''}" data-view="${key}">${view.label}</button>
      `).join('');

      els.nav.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeView = btn.dataset.view;
          updateView();
        });
      });
    }

    function renderStats() {
      const data = state.data;
      const cards = [
        { label: 'Clients actifs', value: data.clients.filter(r => r.Statut_Client === 'Actif').length, help: 'Base clients active' },
        { label: 'Chantiers', value: data.chantiers.length, help: 'Prestations référencées' },
        { label: 'Interventions planifiées', value: data.interventions.filter(r => String(r.Statut_Intervention).includes('Planifiée')).length, help: 'À venir' },
        { label: 'Factures', value: data.factures.length, help: 'Émises ou payées' }
      ];

      els.stats.innerHTML = cards.map(card => `
        <article class="card">
          <h3>${card.label}</h3>
          <strong>${card.value}</strong>
          <span class="muted">${card.help}</span>
        </article>
      `).join('');
    }

    function getCurrentRows() {
      return state.data[state.activeView] || [];
    }

    function getCurrentSheetName() {
      return APP_CONFIG.views[state.activeView].sheet;
    }

    function getVisibleColumns(sheetName, rows) {
      const preferred = APP_CONFIG.fieldOrder[sheetName] || [];
      const keys = new Set();
      rows.forEach(row => Object.keys(row).forEach(k => !k.startsWith('_') && keys.add(k)));
      const ordered = preferred.filter(k => keys.has(k));
      [...keys].forEach(k => { if (!ordered.includes(k)) ordered.push(k); });
      return ordered;
    }

    function renderTable() {
      const rows = state.filtered;
      const sheetName = getCurrentSheetName();
      const columns = getVisibleColumns(sheetName, rows.length ? rows : getCurrentRows());

      if (!rows.length) {
        els.tableWrap.innerHTML = `<div class="empty">Aucun enregistrement à afficher.</div>`;
        return;
      }

      const html = `
        <table>
          <thead>
            <tr>
              ${columns.map(col => `<th>${escapeHtml(col)}</th>`).join('')}
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>
                ${columns.map(col => `<td>${formatCell(col, row[col])}</td>`).join('')}
                <td>
                  <div class="actions">
                    <button class="secondary" data-edit="${getRowId(sheetName, row)}">Modifier</button>
                    <button class="danger" data-delete="${getRowId(sheetName, row)}">Archiver</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      els.tableWrap.innerHTML = html;

      els.tableWrap.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => openModal(btn.dataset.edit));
      });

      els.tableWrap.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => handleDelete(btn.dataset.delete));
      });
    }

    function getRowId(sheetName, row) {
      const field = APP_CONFIG.idFields[sheetName];
      return row[field];
    }

    function updateView() {
      renderNav();
      const label = APP_CONFIG.views[state.activeView].label;
      els.pageTitle.textContent = label;
      els.pageSubtitle.textContent = `Gestion de la table ${label}.`;
      applySearch();
      renderToolbar();
    }

    function applySearch() {
      const q = els.searchInput.value.trim().toLowerCase();
      const rows = getCurrentRows();
      if (!q) {
        state.filtered = rows;
      } else {
        state.filtered = rows.filter(row => Object.entries(row).some(([key, value]) => {
          if (key.startsWith('_')) return false;
          return String(value || '').toLowerCase().includes(q);
        }));
      }
      renderTable();
    }

    function renderToolbar() {
      const rows = getCurrentRows();
      const archivedCount = rows.filter(r => String(r.Archive || '').toLowerCase() === 'oui').length;
      els.toolbarActions.innerHTML = `
        <span class="muted">${rows.length} ligne(s) · ${archivedCount} archivée(s)</span>
      `;
    }

    function buildFieldInput(sheetName, field, value = '') {
      const lower = field.toLowerCase();
      const label = `<label class="${field === 'Notes' || field === 'Description_Technique' ? 'full' : ''}"><div style="font-size:12px;font-weight:600;margin:0 0 6px;color:#6d655d">${field}</div>`;
      const closing = '</label>';
      const isId = field === APP_CONFIG.idFields[sheetName];
      const readonly = isId && state.editRecord ? 'readonly' : '';

      if (lower.includes('notes') || lower.includes('description')) {
        return `${label}<textarea name="${field}" rows="4" ${readonly}>${value || ''}</textarea>${closing}`;
      }

      if (field === 'Archive') {
        return `${label}<select name="${field}"><option value="Non" ${value === 'Non' ? 'selected' : ''}>Non</option><option value="Oui" ${value === 'Oui' ? 'selected' : ''}>Oui</option></select>${closing}`;
      }

      const type = lower.includes('date') ? 'date' : 'text';
      return `${label}<input type="${type}" name="${field}" value="${value || ''}" ${readonly} />${closing}`;
    }

    function openModal(id = null) {
      const sheetName = getCurrentSheetName();
      const rows = getCurrentRows();
      const columns = getVisibleColumns(sheetName, rows);
      state.editRecord = id ? rows.find(r => String(getRowId(sheetName, r)) === String(id)) : null;

      els.modalTitle.textContent = state.editRecord ? 'Modifier un enregistrement' : 'Nouvel enregistrement';
      els.modalSubtitle.textContent = sheetName + ' · ' + (state.editRecord ? 'mise à jour' : 'création');
      els.recordForm.innerHTML = columns.map(field => buildFieldInput(sheetName, field, state.editRecord ? state.editRecord[field] : '')).join('');
      els.modalBackdrop.classList.add('open');
    }

    function closeModal() {
      state.editRecord = null;
      els.modalBackdrop.classList.remove('open');
      els.recordForm.innerHTML = '';
    }

    async function handleDelete(id) {
      const sheetName = getCurrentSheetName();
      if (!confirm('Archiver cet enregistrement ?')) return;
      await apiPost({ action: 'delete', sheet: sheetName, id });
      await loadData();
    }

    async function loadData() {
      const res = await apiGet({ action: 'bootstrap' });
      state.data = res.data;
      const p = state.data.parametres || {};
      els.companyMeta.textContent = [p.tradeName || p.companyName || 'AlainB Pro', p.city || ''].filter(Boolean).join(' · ');
      renderStats();
      updateView();
    }

    els.searchInput.addEventListener('input', applySearch);
    els.refreshBtn.addEventListener('click', loadData);
    els.newBtn.addEventListener('click', () => openModal());
    els.closeModalBtn.addEventListener('click', closeModal);
    els.cancelBtn.addEventListener('click', closeModal);
    els.modalBackdrop.addEventListener('click', e => { if (e.target === els.modalBackdrop) closeModal(); });

    els.recordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const sheetName = getCurrentSheetName();
      const fd = new FormData(els.recordForm);
      const data = Object.fromEntries(fd.entries());
      const idField = APP_CONFIG.idFields[sheetName];

      if (state.editRecord) {
        await apiPost({ action: 'update', sheet: sheetName, id: state.editRecord[idField], data });
      } else {
        await apiPost({ action: 'create', sheet: sheetName, data });
      }

      closeModal();
      await loadData();
    });

    loadData().catch(error => {
      els.tableWrap.innerHTML = `<div class="empty">Erreur de connexion à l'API : ${escapeHtml(error.message)}</div>`;
    });
  </script>
</body>
</html>
