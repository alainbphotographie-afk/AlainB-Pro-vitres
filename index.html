<script>
  // Remplace ton URL Apps Script ici
  const API_URL = "https://script.google.com/macros/s/AKfycbyp1FZYrDgsD7JLTnEYnjnISWJfb3LF7Pl95gHo-XQmbEmZsfeuq_jM5s6hnY2MJJhu/exec"; //V5

  // Fonction universelle d'envoi vers Google Sheets
  function triggerGoogleSheetsSync() {
    setTimeout(() => {
      try {
        const rawStorage = localStorage.getItem('alainb_pro_data') || localStorage.getItem('AlainBProData');
        if (!rawStorage) return;
        const currentData = JSON.parse(rawStorage);

        const modalEl = document.querySelector('.modal, div[class*="modal"], div[class*="dialog"], form');
        let clientId = "";
        let sourceValue = "";

        if (modalEl) {
          const idInput = modalEl.querySelector('input[value^="CLI-"], input[value^="LOU"], input[name="id"]');
          if (idInput) clientId = idInput.value;
          const selectSource = modalEl.querySelector('select');
          if (selectSource) sourceValue = selectSource.value;
        }

        if (currentData.clients) {
          currentData.clients = currentData.clients.map(c => {
            if ((clientId && c.id === clientId) || currentData.clients.length === 1) {
              if (sourceValue) c.source = sourceValue;
            }
            return {
              ID_Client: c.id || '',
              Nom_Affichage: c.name || '',
              Prenom: c.first || '',
              Nom: c.last || '',
              Entreprise: c.company || '',
              Statut_Client: c.status || 'Actif',
              Telephone: String(c.phone || ''),
              Email: c.email || '',
              Adresse_Ligne_1: c.street || '',
              Code_Postal: String(c.postal || ''),
              Ville: c.city || '',
              Canal_Obtention: c.source || c.origin || c.canal || '',
              Notes: c.notes || '',
              Archive: c.archived ? 'Oui' : 'Non'
            };
          });
        }

        const sheetPayload = {
          clients: currentData.clients || [],
          chantiers: (currentData.chantiers || []).map(c => ({
            ID_Chantier: c.id || '',
            ID_Client: c.client || '',
            Nom_Chantier: c.name || '',
            Description: c.description || '',
            Tarif_HT: c.price || 0,
            Duree_Estimee: c.duration || '',
            Statut_Chantier: c.status || '',
            Notes: c.notes || '',
            Archive: c.archived ? 'Oui' : 'Non'
          })),
          interventions: (currentData.interventions || []).map(i => ({
            ID_Intervention: i.id || '',
            ID_Client: i.client || '',
            ID_Chantier: i.chantier || '',
            Date_Intervention: i.date || '',
            Heure: i.hour || '',
            Duree_Reelle: i.duration || '',
            Montant: i.amount || 0,
            Statut_Intervention: i.status || '',
            ID_Facture: i.invoiceId || '',
            Notes: i.notes || '',
            Archive: i.archived ? 'Oui' : 'Non'
          })),
          devis: (currentData.devis || []).map(d => ({
            ID_Devis: d.id || '',
            ID_Client: d.client || '',
            ID_Chantier: d.chantier || '',
            Date_Creation: d.created || '',
            Montant_Total: d.amount || 0,
            Statut_Devis: d.status || '',
            Date_Visite: d.visitDate || '',
            Heure_Visite: d.visitHour || '',
            Notes: d.notes || '',
            Archive: d.archived ? 'Oui' : 'Non'
          })),
          factures: (currentData.factures || []).map(f => ({
            ID_Facture: f.id || '',
            ID_Client: f.client || '',
            Date_Facture: f.date || '',
            Statut_Facture: f.status || '',
            Mode_Paiement: f.payment || '',
            Date_Paiement: f.paidDate || '',
            Montant_Paye: f.paidAmount || 0,
            Notes: f.notes || '',
            Archive: f.archived ? 'Oui' : 'Non'
          })),
          relances: (currentData.relances || []).map(r => ({
            ID_Relance: r.id || '',
            ID_Client: r.client || '',
            Date_Relance: r.date || '',
            Canal: r.channel || '',
            Objet: r.subject || '',
            Notes: r.notes || ''
          }))
        };

        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'syncAll', data: sheetPayload })
        }).then(res => res.json())
          .then(res => console.log("Google Sheets mis à jour :", res))
          .catch(err => console.error("Erreur sync :", err));
      } catch (e) {
        console.error("Erreur :", e);
      }
    }, 400);
  }

  // Interception des clics sur les boutons de validation
  document.addEventListener('click', function(e) {
    const target = e.target.closest('button') || e.target;
    if (target) {
      const text = (target.innerText || target.textContent || '').toLowerCase();
      if (text.includes('enregistrer') || text.includes('valider') || text.includes('créer') || text.includes('modifier') || text.includes('plus tard')) {
        triggerGoogleSheetsSync();
      }
    }
  }, true);

  // Interception des modifications du localStorage par l'application
  if (typeof window.originalSetItem === 'undefined') {
    window.originalSetItem = localStorage.setItem;
    localStorage.setItem = function(key, value) {
      window.originalSetItem.apply(this, arguments);
      if (key === 'alainb_pro_data' || key === 'AlainBProData') {
        triggerGoogleSheetsSync();
      }
    };
  }
</script>
